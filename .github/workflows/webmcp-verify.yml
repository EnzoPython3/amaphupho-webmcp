name: WebMCP Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Check dash policy
        run: npm run check:dashes

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/amaphupho-vite.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/amaphupho-vite.log
          exit 1

      - name: Run WebMCP browser tests
        env:
          TEST_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/e2e/webmcp.spec.ts --project=e2e
